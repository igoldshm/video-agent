[project]
name = "cutroom"
version = "0.2.0"
description = "Describe a video, get a video: an agent harness and web app for multi-shot AI video creation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cutroom"]

[tool.setuptools.package-data]
cutroom = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
